name: Automated GPT Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: AI PR Reviewer
        uses: coderabbitai/ai-pr-reviewer@v1
        with:
          debug: false
          review_comment_lgtm: false
          openai_heavy_model: "gpt-4o"      # 정밀 분석용 모델
          openai_light_model: "gpt-4o-mini" # 요약/간단 분석용 모델 (비용 절감)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}